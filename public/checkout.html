<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasse - W SHOP</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span>W</span> SHOP</a>
  <nav class="topnav">
    <a href="/cart">Warenkorb <span class="cart-count">0</span></a>
  </nav>
</header>

<main class="wrap" style="max-width:720px">
  <section class="panel">
    <h2>Ihre Bestellung</h2>
    <div id="order-lines"></div>
    <div id="order-total"></div>
  </section>

  <section class="panel">
    <h2>Ihre Daten</h2>
    <div id="form-msg"></div>
    <form id="checkout-form">
      <label class="field"><span>Vollständiger Name *</span><input type="text" name="customer_name" required maxlength="200" autocomplete="name"></label>
      <label class="field"><span>E-Mail *</span><input type="email" name="email" required maxlength="200" autocomplete="email"></label>
      <label class="field"><span>Telefon / WhatsApp</span><input type="tel" name="phone" maxlength="50" autocomplete="tel" placeholder="+374..."></label>
      <button class="btn" type="submit" id="submit-btn">Bestellung aufgeben</button>
    </form>
    <p class="hint" style="margin-top:14px">Zahlung erfolgt bei Abholung. Wir melden uns zur Bestätigung.</p>
  </section>
</main>

<script src="/js/store.js"></script>
<script>
WSHOP.header();
const cart = WSHOP.getCart();
const linesEl = document.getElementById('order-lines');
const totalEl = document.getElementById('order-total');

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if (!cart.length) {
  linesEl.innerHTML = '<div class="empty">Ihr Warenkorb ist leer. <a href="/">Zurück zum Shop</a></div>';
  document.getElementById('checkout-form').style.display = 'none';
} else {
  WSHOP.api('/api/products').then(products => {
    const byId = Object.fromEntries(products.map(p => [p.id, p]));
    let total = 0;
    linesEl.innerHTML = cart.map(c => {
      const p = byId[c.product_id];
      if (!p) return '';
      const isSpecial = c.variant === 'special';
      const price = isSpecial ? (p.variant_price2 || p.price_cents) : p.price_cents;
      total += price * c.qty;
      const specialLabel = isSpecial ? '<div class="sub">Schaufenster-Banane</div>' : '';
      return `<div class="line-item">
        <img src="${p.image_path || '/img/egg-placeholder.svg'}" alt="">
        <div class="info">
          <div class="nm">${esc(p.name)} × ${c.qty}</div>
          ${c.drawing_id ? '<div class="sub">Mit eigener Zeichnung</div>' : ''}
          ${specialLabel}
        </div>
        <div style="font-weight:600">${WSHOP.money(price * c.qty)}</div>
      </div>`;
    }).join('');
    totalEl.innerHTML = `<div class="totals">Gesamt: ${WSHOP.money(total)} EUR</div>`;
  });

}

document.getElementById('checkout-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-msg');
  btn.disabled = true;
  msg.innerHTML = '';
  const f = new FormData(e.target);
  const body = {
    customer_name: f.get('customer_name'),
    phone: f.get('phone'),
    email: f.get('email'),
    items: WSHOP.getCart().map(c => ({ product_id: c.product_id, qty: c.qty, drawing_id: c.drawing_id || '', variant: c.variant || '' })),
  };
  try {
    const res = await WSHOP.api('/api/orders', { method: 'POST', body });
    WSHOP.clearCart();
    const now = new Date();
    const day = now.getDay();
    const hour = now.getHours();
    const minutes = now.getMinutes();
    const time = hour * 60 + minutes;

    // Пн-Пт: 14:00-20:30 (840-1230), Сб-Вс: 9:00-21:00 (540-1260)
    const isWeekday = day >= 1 && day <= 5;
    const isOpen = isWeekday ? (time >= 840 && time < 1230) : (time >= 540 && time < 1260);

    const hoursMsg = isOpen ? '' : `
      <div class="msg info" style="margin-top:14px">
        <strong>Sie haben Ihre Bestellung außerhalb der Öffnungszeiten aufgegeben. Wir liefern Ihnen innerhalb der Öffnungszeiten zu.</strong><br><br>
        Montag-Freitag: 14:00-20:30<br>
        Samstag, Sonntag: 9:00-21:00<br><br>
        <small>*Die Öffnungszeiten können sich ändern.</small>
      </div>`;

    msg.innerHTML = `<div class="msg ok"><strong>Bestellung #${res.order_id} aufgegeben!</strong><br>Vielen Dank – wir melden uns zur Abholbestätigung.</div>${hoursMsg}`;
    e.target.style.display = 'none';
    document.getElementById('order-lines').insertAdjacentHTML('afterend', '');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    msg.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
